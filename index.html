<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dumps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=9d38bca">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <button id="menu-botao" class="menu-botao" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="marca">Dumps</div>
    <div class="header-spacer"></div>
    <div class="topo">
      <span id="rotulo-idioma" class="rotulo-idioma"></span>
      <div class="idioma-picker">
        <button id="idioma-botao" class="idioma-botao" type="button" aria-haspopup="listbox" aria-expanded="false"></button>
        <div id="idioma-menu" class="idioma-menu" role="listbox" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="titulo">Dumps</h1>
      <p class="sub" data-i18n="sub">Arquivos organizados por jogo e versão.</p>
      <div class="busca">
        <span class="busca-icon" aria-hidden="true"></span>
        <input id="q" type="search" autocomplete="off">
        <span id="n" class="contagem"></span>
      </div>
      <div class="lista-acoes">
        <button id="lista-botao" class="lista-botao" type="button" aria-expanded="false" aria-controls="lista"></button>
        <div id="ordem-controles" class="ordem-controles" hidden>
          <button id="ordem-novo" class="ordem-botao ativo" type="button"></button>
          <button id="ordem-antigo" class="ordem-botao" type="button"></button>
        </div>
      </div>
    </section>

    <section class="games-section" aria-labelledby="games-title">
      <div class="section-heading">
        <h2 id="games-title" data-i18n="listaTitulo">Lista de dumps</h2>
        <span class="heading-line"></span>
      </div>
      <div id="lista" hidden></div>
    </section>

    <div id="vazio" class="vazio" data-i18n="vazio" hidden></div>
    <div id="erro" class="vazio" data-i18n="erro" hidden></div>
  </main>

  <footer>
    <p data-i18n="aviso"></p>
    <p><span data-i18n="discord"></span> <strong>Zaka_script</strong></p>
  </footer>
</div>
<script src="javascript.js"></script>
</body>
</html>
